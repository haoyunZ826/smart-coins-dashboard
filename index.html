<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smart_coins · 合约模拟盘监控</title>
<style>
  :root {
    color-scheme: dark;
    --surface-0: #0e1013;
    --surface-1: #171a1f;
    --surface-2: #21252c;
    --border:    #2e333c;
    --text-primary:   #ffffff;
    --text-secondary: #b9c0cc;
    --text-muted:     #7d8494;
    --good:     #16b364;
    --critical: #e04b4b;
    --warning:  #f5b014;
    --accent:   #4a8fe8;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 24px 20px 48px;
    max-width: 1180px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; letter-spacing: .02em; }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--text-secondary); text-transform: uppercase;
  }
  .badge.live { color: var(--critical); border-color: var(--critical); }
  .badge.halt { color: var(--warning); border-color: var(--warning); }
  .badge.kill { color: var(--critical); border-color: var(--critical); }
  .badge.active { background: var(--surface-2); color: var(--text-primary); }
  .updated { color: var(--text-muted); font-size: 12px; margin-left: auto; }
  .funnel { color: var(--text-muted); font-size: 12px; margin: 2px 0 18px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .tile .k { font-size: 11px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
  .tile .v { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); }
  .neg { color: var(--critical); }
  .goalbar { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .goalbar > div { height: 100%; background: var(--accent); min-width: 1px; }

  h2 { font-size: 14px; color: var(--text-secondary); letter-spacing: .05em;
       text-transform: uppercase; margin: 26px 0 10px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); }
  table { border-collapse: collapse; width: 100%; min-width: 700px; }
  th, td { padding: 8px 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { font-size: 11px; color: var(--text-muted); letter-spacing: .05em; text-transform: uppercase;
       border-bottom: 1px solid var(--border); font-weight: 600; }
  td { border-bottom: 1px solid var(--surface-2); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  th:first-child, td:first-child { text-align: left; }
  td.sym { font-weight: 650; }
  td.reason { text-align: left; color: var(--text-secondary); max-width: 380px;
              overflow: hidden; text-overflow: ellipsis; }
  .long { color: var(--good); font-weight: 600; }
  .short { color: var(--critical); font-weight: 600; }
  .empty { padding: 18px 14px; color: var(--text-muted); }
  .note { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
  .err { color: var(--warning); padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>smart_coins</h1>
  <span class="badge" id="mode">—</span>
  <span class="badge halt" id="halt" hidden>日亏熔断</span>
  <span class="badge kill" id="kill" hidden>KILLED</span>
  <span style="display:inline-flex;gap:4px">
    <button class="badge active" id="tabAgg" style="cursor:pointer;background:none" onclick="switchProfile('data.json', this)">⚡ 激进版</button>
    <button class="badge" id="tabDegen" style="cursor:pointer;background:none" onclick="switchProfile('degen.json', this)">🎰 赌徒版</button>
  </span>
  <span class="updated" id="updated">加载中…</span>
</header>
<div class="funnel" id="funnel"></div>
<div class="funnel" id="regime"></div>

<div class="tiles" id="tiles"></div>

<h2>持仓 <span id="posCount"></span></h2>
<div class="tablewrap"><div id="positions" class="empty">—</div></div>

<h2>当前候选（通过全部过滤，前 20）</h2>
<div class="tablewrap"><div id="candidates" class="empty">—</div></div>
<p class="note">多网选币：CoinGecko 市值 Top250 × OKX/Gate 永续量能过滤 → 15m K线动量打分。多数时刻候选少是正常状态。</p>

<h2>历史成交（最近 60 笔）</h2>
<div class="tablewrap"><div id="trades" class="empty">—</div></div>

<script>
let profile = 'data.json';
let timer = null;

const fmt = (x, d = 2) => x == null ? '—' : Number(x).toLocaleString('en-US', {maximumFractionDigits: d, minimumFractionDigits: d});
const fmtP = (x, d = 6) => x == null ? '—' : Number(x).toLocaleString('en-US', {maximumFractionDigits: d});
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const sign = x => (x > 0 ? '+' : '') + fmt(x);
const ago = ts => {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return Math.round(s) + 's 前';
  if (s < 5400) return Math.round(s / 60) + 'm 前';
  return (s / 3600).toFixed(1) + 'h 前';
};

function switchProfile(file, btn) {
  profile = file;
  document.querySelectorAll('#tabAgg,#tabDegen').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  load();
}

function tile(k, v, s = '', vc = '') {
  return `<div class="tile"><div class="k">${k}</div><div class="v ${vc}">${v}</div><div class="s">${s}</div></div>`;
}

function render(d) {
  const st = d.status || {};
  document.getElementById('mode').textContent = d.mode === 'live' ? 'LIVE' : 'PAPER';
  document.getElementById('mode').className = 'badge' + (d.mode === 'live' ? ' live' : '');
  document.getElementById('halt').hidden = !st.halted;
  document.getElementById('kill').hidden = !st.killed;
  document.getElementById('updated').textContent = '更新于 ' + ago(d.generated_at);

  const f = d.funnel || {};
  document.getElementById('funnel').textContent =
    `漏斗：CG市值榜 ${f.cg_top ?? '—'} → 市值达标 ${f.mcap_pass ?? '—'} → 双所量能达标 ${f.venue_pass ?? '—'} → 深扫 ${f.deep_scanned ?? '—'} → 候选 ${f.candidates ?? '—'}`;

  const rg = d.regime || {};
  const rgName = {risk_on: '🟢 risk-on（禁山寨空单）', risk_off: '🔴 risk-off（禁山寨多单）', neutral: '⚪ 中性'}[rg.state] || rg.state;
  document.getElementById('regime').textContent =
    `大盘风向：${rgName} · BTC 4h ${sign(rg.btc_ret_4h)}% · 24h ${sign(rg.btc_ret_24h)}%`;

  const eq = st.equity ?? 0, start = st.starting ?? 1000;
  const goal = st.goal_progress_pct ?? 0;
  document.getElementById('tiles').innerHTML =
    tile('权益', '$' + fmt(eq), `本金 $${fmt(start, 0)} · 现金 $${fmt(st.cash)}`) +
    tile('总收益', sign(st.pnl_pct) + '%', `目标 100x 进度 ${fmt(goal, 2)}%`, cls(st.pnl_pct)) +
    tile('今日', sign(st.day_pnl_pct) + '%', `回撤 -${fmt(st.drawdown_pct)}%`, cls(st.day_pnl_pct)) +
    tile('总杠杆', fmt(st.gross_leverage, 2) + 'x', `名义敞口 $${fmt(st.gross_notional, 0)}`) +
    tile('战绩', `${st.wins ?? 0}W / ${st.losses ?? 0}L`, `${st.trade_count ?? 0} 笔成交` + (st.loss_streak ? ` · 连败${st.loss_streak}` : '')) +
    tile('成本', '$' + fmt((st.fees ?? 0) + (st.funding ?? 0)), `手续费 $${fmt(st.fees)} · 资金费 $${fmt(st.funding)}`) +
    `<div class="tile" style="grid-column:1/-1"><div class="k">100x 目标</div><div class="goalbar"><div style="width:${Math.min(100, goal)}%"></div></div><div class="s">$${fmt(eq)} / $${fmt(start * 100, 0)}</div></div>`;

  // positions
  const ps = d.positions || [];
  document.getElementById('posCount').textContent = ps.length ? `(${ps.length})` : '';
  document.getElementById('positions').outerHTML = ps.length ? `<table id="positions"><thead><tr>
    <th>币</th><th>方向</th><th>杠杆</th><th>开仓价</th><th>现价</th><th>止损</th><th>爆仓价</th>
    <th>名义</th><th>浮盈$</th><th>R</th><th>TP</th><th>持仓时长</th><th>资金费</th></tr></thead><tbody>` +
    ps.map(p => `<tr>
      <td class="sym">${p.symbol}<span style="color:var(--text-muted);font-weight:400"> ·${p.venue}</span></td>
      <td class="${p.side}">${p.side === 'long' ? '多' : '空'}</td>
      <td>${fmt(p.leverage, 1)}x</td>
      <td>${fmtP(p.entry)}</td><td>${fmtP(p.mark)}</td><td>${fmtP(p.stop)}</td><td>${fmtP(p.liq)}</td>
      <td>$${fmt(p.notional, 0)}</td>
      <td class="${cls(p.upnl)}">${sign(p.upnl)}</td>
      <td class="${cls(p.r)}">${sign(p.r)}R</td>
      <td>${p.tp_hit || 0}${p.runner ? '·跑' : ''}</td>
      <td>${fmt(p.age_h, 1)}h</td>
      <td>${sign(-p.funding_paid)}</td></tr>`).join('') + '</tbody></table>'
    : '<div id="positions" class="empty">空仓</div>';

  // candidates
  const cs = d.candidates || [];
  document.getElementById('candidates').outerHTML = cs.length ? `<table id="candidates"><thead><tr>
    <th>币</th><th>方向</th><th>级</th><th>分</th><th>价格</th><th>1h%</th><th>4h%</th><th>24h%</th>
    <th>量能x</th><th>ATR%</th><th>资金费%</th><th>止损%</th><th>市值层</th></tr></thead><tbody>` +
    cs.map(c => `<tr>
      <td class="sym">${c.symbol}<span style="color:var(--text-muted);font-weight:400"> ·${c.venue}</span></td>
      <td class="${c.side}">${c.side === 'long' ? '多' : '空'}</td>
      <td>${c.grade}</td><td>${fmt(c.score, 0)}</td><td>${fmtP(c.price)}</td>
      <td class="${cls(c.ret_1h)}">${sign(c.ret_1h)}</td>
      <td class="${cls(c.ret_4h)}">${sign(c.ret_4h)}</td>
      <td class="${cls(c.ret_24h)}">${sign(c.ret_24h)}</td>
      <td>${fmt(c.vol_surge, 1)}</td><td>${fmt(c.atr_pct, 2)}</td>
      <td>${fmt(c.funding, 3)}</td><td>${fmt(c.stop_pct, 1)}</td>
      <td>${c.tier === 'large' ? '大盘' : '中盘'} #${c.mcap_rank}</td></tr>`).join('') + '</tbody></table>'
    : '<div id="candidates" class="empty">当前无候选 —— 漏斗高精度低召回，空仓等待是策略的一部分</div>';

  // trades
  const ts = d.trades || [];
  document.getElementById('trades').outerHTML = ts.length ? `<table id="trades"><thead><tr>
    <th>时间</th><th>币</th><th>动作</th><th>方向</th><th>价格</th><th>名义</th><th>盈亏$</th><th>原因</th></tr></thead><tbody>` +
    ts.map(t => `<tr>
      <td>${new Date(t.timestamp * 1000).toLocaleString('zh-CN', {hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'})}</td>
      <td class="sym">${t.symbol}</td>
      <td>${t.action === 'open' ? '开' : '平'}</td>
      <td class="${t.side}">${t.side === 'long' ? '多' : '空'}</td>
      <td>${fmtP(t.price)}</td><td>$${fmt(t.notional_usd, 0)}</td>
      <td class="${cls(t.realized_pnl_usd)}">${t.action === 'close' ? sign(t.realized_pnl_usd) : '—'}</td>
      <td class="reason">${(t.reason || '').slice(0, 90)}</td></tr>`).join('') + '</tbody></table>'
    : '<div id="trades" class="empty">暂无成交</div>';
}

async function load() {
  try {
    const r = await fetch(profile + '?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById('updated').textContent = '数据加载失败：' + e.message;
  }
  clearTimeout(timer);
  timer = setTimeout(load, 30_000);
}
load();
</script>
</body>
</html>
